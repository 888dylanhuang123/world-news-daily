name: Sync news data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest news
        run: |
          mkdir -p data
          curl -fsSL "https://news-digest.worldnews7k2n.workers.dev/api/news?code=WT-7K2N-2026" -o data/news.json

      - name: Commit and push
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update news data"
          git push

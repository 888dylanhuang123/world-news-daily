<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>国际新闻早报</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #6b7488;
      --line: #e6eaf2;
      --blue: #1a5cff;
      --blue-soft: #eef3ff;
      --green: #0f9d6b;
      --orange: #f28b30;
      --shadow: 0 10px 30px rgba(23, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .hero {
      background: linear-gradient(135deg, #10214d 0%, #1a5cff 55%, #4a8cff 100%);
      color: #fff;
      padding: 26px 20px 52px;
    }
    .hero-inner, .wrap { max-width: 980px; margin: 0 auto; }
    .eyebrow { font-size: 12px; letter-spacing: .16em; opacity: .75; text-transform: uppercase; }
    h1 { margin: 6px 0 8px; font-size: 28px; line-height: 1.2; }
    .sub { margin: 0; opacity: .82; font-size: 14px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    button, .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-light { background: #fff; color: #14357a; }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.28); }
    .wrap { padding: 0 14px 44px; }
    .video-zone {
      margin-top: -34px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .video-card {
      display: block;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px;
      text-decoration: none;
      color: var(--ink);
      background: linear-gradient(160deg, #f8faff, #fff);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .video-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(23,32,51,.08); }
    .video-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 18px; margin-bottom: 10px; }
    .video-card strong { display: block; font-size: 14px; }
    .video-card small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    .video-card em { display: inline-block; margin-top: 9px; font-style: normal; color: var(--blue); font-size: 12px; }
    nav { display: flex; gap: 8px; overflow-x: auto; padding: 18px 2px 4px; }
    nav button { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
    nav button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .meta-line { color: var(--muted); font-size: 12px; padding: 8px 2px 2px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin: 10px 0;
    }
    .card-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; }
    .badge { border-radius: 6px; padding: 1px 8px; font-size: 12px; background: var(--blue-soft); color: var(--blue); }
    .badge.video { background: #fff2e6; color: #c25a00; }
    .src, .time { color: var(--muted); font-size: 12px; }
    .time { margin-left: auto; }
    .title-zh { display: block; color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 650; line-height: 1.45; }
    .title-zh:hover { color: var(--blue); }
    .title-en { display: block; color: var(--muted); text-decoration: none; font-size: 12.5px; margin-top: 3px; }
    .summary { color: #3f485c; font-size: 14px; margin: 8px 0 0; }
    .go { display: inline-block; margin-top: 10px; color: var(--blue); text-decoration: none; font-size: 13px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 10px; }
    .footer { text-align: center; color: #9aa3b5; font-size: 12px; padding: 10px 0 30px; }
    @media (max-width: 720px) {
      .video-grid { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
      .hero { padding-bottom: 48px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">WORLD NEWS · DAILY BRIEF</div>
      <h1>国际新闻早报</h1>
      <p class="sub">中文为主 · 中英对照 · 外贸人每天 3 分钟看懂世界</p>
      <div class="hero-actions">
        <button class="btn-light" id="speakBtn">🔊 听早报</button>
        <button class="btn-ghost" id="refreshBtn">↻ 刷新内容</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="video-zone">
      <div class="section-head">
        <h2>今日视频</h2>
        <span>官方视频入口 · 国内可直接打开</span>
      </div>
      <div class="video-grid">
        <a class="video-card" href="https://tv.cctv.com/lm/xwlb/" target="_blank" rel="noopener">
          <div class="video-icon">▶</div>
          <strong>央视新闻联播</strong>
          <small>当天的国内外大事，官方完整视频。</small>
          <em>打开视频 →</em>
        </a>
        <a class="video-card" href="https://www.cgtn.com/tv" target="_blank" rel="noopener">
          <div class="video-icon">▶</div>
          <strong>CGTN 国际新闻</strong>
          <small>国际时事、经贸与全球热点直播。</small>
          <em>打开视频 →</em>
        </a>
        <a class="video-card" href="https://www.thepaper.cn/channel_25951" target="_blank" rel="noopener">
          <div class="video-icon">▶</div>
          <strong>澎湃新闻视频</strong>
          <small>国际现场、财经与深度短视频。</small>
          <em>打开视频 →</em>
        </a>
      </div>
    </section>

    <nav id="tabs"></nav>
    <div class="meta-line" id="metaLine">正在加载新闻…</div>
    <main id="list"></main>
    <div class="footer">内容由自动抓取程序更新 · 每天 7:30 微信提醒</div>
  </div>

  <script>
    const CATS = [
      { k: 'all', v: '全部' },
      { k: 'politics', v: '政治' },
      { k: 'economy', v: '经贸' },
      { k: 'forex', v: '汇率' },
      { k: 'tariff', v: '关税' },
      { k: 'energy', v: '能源' },
      { k: 'shipping', v: '航运' },
      { k: 'video', v: '视频' }
    ];
    let current = 'all';
    let items = [];
    let meta = null;
    const NOISE = /(football|soccer|world cup|cricket|manchester united|grand prix|formula 1|\bf1\b|tennis|basketball|\bnba\b|premier league|champions league|mbappe|olympic|rapper|singer|actor|actress|celebrity|film|movie|netflix|music|album|concert|fashion|kardashian|oscars|grammy|royal family)/i;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const catLabel = (k) => (CATS.find((c) => c.k === k) || {}).v || '资讯';
    const fmt = (s) => { if (!s) return ''; const d = new Date(s); return d.toLocaleString('zh-CN', { hour12: false }); };

    function renderTabs() {
      const tabs = $('tabs');
      tabs.innerHTML = '';
      CATS.forEach((c) => {
        const b = document.createElement('button');
        b.textContent = c.v;
        if (c.k === current) b.className = 'on';
        b.onclick = () => { current = c.k; renderTabs(); renderList(); };
        tabs.appendChild(b);
      });
    }

    function renderList() {
      const list = $('list');
      list.innerHTML = '';
      let shown = items;
      if (current === 'video') shown = items.filter((x) => x.hasVideo);
      else if (current !== 'all') shown = items.filter((x) => x.category === current);
      if (!shown.length) {
        list.innerHTML = '<p class="empty">暂无内容，稍后再试。</p>';
        return;
      }
      shown.slice(0, 120).forEach((it) => {
        const card = document.createElement('article');
        card.className = 'card';
        let html = '<div class="card-head"><span class="badge">' + esc(catLabel(it.category)) + '</span>';
        if (it.hasVideo) html += '<span class="badge video">视频</span>';
        html += '<span class="src">' + esc(it.source) + '</span><span class="time">' + fmt(it.published) + '</span></div>';
        html += '<a class="title-zh" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.titleZh || it.title) + '</a>';
        if (it.title && it.title !== it.titleZh) {
          html += '<a class="title-en" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>';
        }
        if (it.summaryZh) html += '<p class="summary">' + esc(it.summaryZh) + '</p>';
        html += '<a class="go" href="' + esc(it.link) + '" target="_blank" rel="noopener">阅读原文 →</a>';
        card.innerHTML = html;
        list.appendChild(card);
      });
    }

    function loadDataScript() {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'data/news.js?v=' + Date.now();
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function load() {
      try {
        let data;
        try {
          await loadDataScript();
          data = window.__NEWS_DATA__;
        } catch {}
        if (!data) {
          const res = await fetch('data/news.json?ts=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          data = await res.json();
        }
        const rawItems = Array.isArray(data) ? data : (data.items || []);
        items = rawItems.filter((x) => !NOISE.test((x.title || '') + ' ' + (x.titleZh || '')));
        meta = Array.isArray(data) ? null : data.meta;
        $('metaLine').textContent = meta && meta.lastUpdated
          ? '最近更新：' + fmt(meta.lastUpdated) + ' · 共 ' + items.length + ' 条'
          : '共 ' + items.length + ' 条新闻';
        renderTabs();
        renderList();
      } catch (err) {
        $('metaLine').textContent = '新闻数据还未生成，正在等待同步…';
        $('list').innerHTML = '<p class="empty">如果你刚部署，请到 GitHub Actions 手动运行一次同步任务。</p>';
      }
    }

    function speak() {
      const btn = $('speakBtn');
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器不支持语音朗读，请换用 Chrome、Edge 或 Safari。');
        return;
      }
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        btn.textContent = '🔊 听早报';
        return;
      }
      const top = items.slice(0, 10);
      if (!top.length) { alert('还没有新闻可以朗读。'); return; }
      const text = '国际新闻早报。' + top.map((x, i) => (i + 1) + '，' + x.titleZh).join('。');
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 1.02;
      u.pitch = 1;
      u.onend = () => { btn.textContent = '🔊 听早报'; };
      u.onerror = () => { btn.textContent = '🔊 听早报'; };
      btn.textContent = '⏹ 停止朗读';
      speechSynthesis.speak(u);
    }

    $('speakBtn').onclick = speak;
    $('refreshBtn').onclick = load;
    load();
  </script>
</body>
</html>
